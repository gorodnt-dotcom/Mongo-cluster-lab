name: maplegrove-sharded-cluster

networks:
  mongo-cluster:
    driver: bridge

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard2a_data:
  shard2b_data:

services:
  # ---- Config server replica set (3 nodes, metadata for the cluster) ----
  cfg1:
    image: mongo:7.0
    container_name: cfg1
    command: mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    ports:
      - "27019:27019"
    volumes:
      - cfg1_data:/data/db
    networks:
      - mongo-cluster

  cfg2:
    image: mongo:7.0
    container_name: cfg2
    command: mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    ports:
      - "27021:27019"
    volumes:
      - cfg2_data:/data/db
    networks:
      - mongo-cluster

  cfg3:
    image: mongo:7.0
    container_name: cfg3
    command: mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    ports:
      - "27022:27019"
    volumes:
      - cfg3_data:/data/db
    networks:
      - mongo-cluster

  # ---- Shard 1 replica set (2 nodes) ----
  shard1a:
    image: mongo:7.0
    container_name: shard1a
    command: mongod --shardsvr --replSet shard1rs --port 27018 --bind_ip_all --wiredTigerCacheSizeGB 0.5
    ports:
      - "27018:27018"
    volumes:
      - shard1a_data:/data/db
    networks:
      - mongo-cluster

  shard1b:
    image: mongo:7.0
    container_name: shard1b
    command: mongod --shardsvr --replSet shard1rs --port 27018 --bind_ip_all --wiredTigerCacheSizeGB 0.5
    ports:
      - "27023:27018"
    volumes:
      - shard1b_data:/data/db
    networks:
      - mongo-cluster

  # ---- Shard 2 replica set (2 nodes) ----
  shard2a:
    image: mongo:7.0
    container_name: shard2a
    command: mongod --shardsvr --replSet shard2rs --port 27020 --bind_ip_all --wiredTigerCacheSizeGB 0.5
    ports:
      - "27020:27020"
    volumes:
      - shard2a_data:/data/db
    networks:
      - mongo-cluster

  shard2b:
    image: mongo:7.0
    container_name: shard2b
    command: mongod --shardsvr --replSet shard2rs --port 27020 --bind_ip_all --wiredTigerCacheSizeGB 0.5
    ports:
      - "27024:27020"
    volumes:
      - shard2b_data:/data/db
    networks:
      - mongo-cluster

  # ---- mongos query router ----
  mongos:
    image: mongo:7.0
    container_name: mongos
    depends_on:
      - cfg1
      - cfg2
      - cfg3
      - shard1a
      - shard1b
      - shard2a
      - shard2b
    command: mongos --configdb cfgrs/cfg1:27019,cfg2:27019,cfg3:27019 --port 27017 --bind_ip_all
    ports:
      - "27017:27017"
    networks:
      - mongo-cluster

  # ---- one-shot setup: initiates replica sets and adds shards ----
  setup:
    image: mongo:7.0
    container_name: cluster-setup
    depends_on:
      - cfg1
      - cfg2
      - cfg3
      - shard1a
      - shard1b
      - shard2a
      - shard2b
      - mongos
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - mongo-cluster
    entrypoint: ["bash", "/scripts/init-cluster.sh"]
